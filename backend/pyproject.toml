# EasyFrame backend 工具配置(运行时依赖以 requirements.blank*.txt 为权威锁)。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 仅打包共享内核 enterprise_platform,供宿主 `pip install -e easyframe/backend`
# 在宿主机 venv 内解析 import(镜像内仍走 Dockerfile COPY 原路径,不依赖本节)。
# blank_app / platform_tests 是框架站宿主与契约测试,不作为包分发。
[project]
name = "easyframe-platform"
version = "0.1.0"
description = "EasyFrame 共享企业平台内核(enterprise_platform)"
requires-python = ">=3.11"

[tool.setuptools]
packages = [
    "enterprise_platform",
    "enterprise_platform.assembly",
    "enterprise_platform.authz",
    "enterprise_platform.easyauth",
]
[tool.ruff]
target-version = "py311"
line-length = 120
extend = "ruff-gates.toml"

[tool.ruff.lint.extend-per-file-ignores]
# 目录型豁免必须写在本仓:ruff-gates.toml 的 glob 锚在片段目录,extend 到下游不会命中宿主路径。
# FastAPI 要求 Depends()/Query() 做默认值,B008 不适用;本仓路由不在 api/ 目录下。
"enterprise_platform/**/*.py" = ["B008"]
"blank_app/**/*.py" = ["B008"]
# 测试是线性 arrange/act/assert,语句多/参数多不等于难维护;圈复杂度仍然管。
"platform_tests/**" = ["PLR0915", "PLR0913"]
# Alembic 迁移文件是生成的,保持原有导入风格;upgrade() 经常是长段 DDL,语句数豁免。
"blank_app/alembic/versions/*.py" = ["I001", "UP007", "UP035", "PLR0915"]

[tool.pytest.ini_options]
testpaths = ["platform_tests"]
asyncio_mode = "auto"
pythonpath = ["."]
